<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f2e9" />
    <meta name="description" content="Shared wallets for trips and experiences." />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("vaulet-theme");
          var theme = saved === "light" || saved === "dark" ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
          document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0d0c1f" : "#f7f2e9");
        } catch (e) {}
      })();
    </script>
    <title>Vaulet — shared wallets for going places</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
