<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <section class="dashboard">
        <div class="dashboard_head">
            <h1>Vaulet Dashboard</h1>
        </div>    

        <div class="contributions"></div>
            <h4 class="contribution_head">Total Contributions:</h4>
            <h2 class="contribution_amt">12,350</h2>
        </div>

        <div class="active_vaults">
            <h4 class="active_vaults_head">Active vaults:</h4>
            <h2 class="active_vaults_number">3</h2>
        </div>

        <div class="create_vault">
            <button class="create_vault_btn" onclick="window.location.href='create-vault.html'"> Create Vault</button>
        </div>

        <div class="join_vault">
            <button class="join_vault_btn">
                Join or Invite a Friend
            </button>
        </div>
    </section>

    <section class="my_vaults">
        <div class="current_vaults">
            <h2>
                Goa Trip
            </h2>
            <p>Group Vaulet - 5 members</p>
            <h2>12,500</h2>

            <p>Your Total contribution: </p>
            <h2>3,000</h2>
        </div>
    </section>
</body>
</html>
