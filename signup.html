<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp</title>
</head>
<body>
    <H1>SignUp</H1>
        <section class="signup_form">
            <form action="login.html">
                <div class="signup"><label for="first_name">Enter your first Name:</label>
                <input type="text" placeholder="First Name"></div>
                
                <div class="signup"><label for="last_name">Enter your Last Name:</label>
                <input type="text" placeholder="Last Name"></div>

                <div class="signup"><label for="email">Enter your Email:</label>
                <input type="text" placeholder="abc@gmail.com"></div>

                <div class="signup"><label for="pass">Password:</label>
                <input type="text" placeholder="Password"></div>
                
                <div class="signup"><label for="DOB">Date of Birth:</label>
                <input type="date"></div>

                <div class="signup_btn">
                    <button>
                        Signup
                        <a href="login.html"></a>
                    </button>
                </div>

                <div class="alr_member">
                    <p>Already a Member?</p>
                    <a href="login.html">Login Here</a>
                </div>
            </form>
        </section>
</body>
</html>
