<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
</head>
<body>
    <H1>Login</H1>
    
    <section class="login_form">
        <form action="dashboard.html">
            <div class="login_un"><label for="Username">Username or Email:</label>
            <input type="text" placeholder="Username"></div>

            <div class="login_pass"><label for="pass">Password:</label>
            <input type="text" placeholder="Password"></div>

            <div class="login_btn">
                <button>
                    Login
                </button>
            </div>

            <div class="login_new-user"><p>New User?</p>
            <a href="signup.html"> Signup</a></div>
            

        </form>
    </section>
</body>
</html>
